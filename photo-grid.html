<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Grid - Instagram Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            padding: 20px 0;
        }

        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            color: #262626;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8e8e8e;
            font-size: 14px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background-color: #efefef;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .photo-item:hover {
            transform: scale(0.98);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .photo-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 15px;
            gap: 6px;
        }

        .info-caption {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .info-location {
            font-size: 13px;
            font-weight: 400;
        }

        .info-date {
            font-size: 12px;
            font-weight: 300;
            opacity: 0.9;
        }

        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: calc(90vh - 80px);
            object-fit: contain;
            display: block;
        }

        .lightbox-info {
            padding: 16px 4px;
            color: #fafafa;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lightbox-caption {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            color: #fff;
        }

        .lightbox-location {
            font-size: 12px;
            font-weight: 400;
            color: #dbdbdb;
        }

        .lightbox-date {
            font-size: 11px;
            font-weight: 300;
            color: #a8a8a8;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 35px;
            font-weight: 200;
            color: #fff;
            cursor: pointer;
            transition: color 0.2s ease;
            line-height: 1;
        }

        .lightbox-close:hover {
            color: #dbdbdb;
        }

        /* Navigation arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: opacity 0.2s ease, background 0.2s ease;
            z-index: 1001;
        }

        .lightbox-nav:hover:not(.disabled) {
            background: #f0f0f0;
        }

        .lightbox-nav.disabled {
            opacity: 0.3;
            cursor: default;
        }

        .lightbox-nav-prev {
            left: 20px;
        }

        .lightbox-nav-next {
            right: 20px;
        }

        .lightbox-nav svg {
            width: 16px;
            height: 16px;
            fill: #262626;
        }

        .lightbox-nav.disabled svg {
            fill: #8e8e8e;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .lightbox-content {
                max-width: 95vw;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }

            .container {
                padding: 0;
            }

            header {
                padding: 0 20px;
            }

            .photo-info {
                padding: 8px;
                gap: 3px;
            }

            .info-caption {
                font-size: 11px;
            }

            .info-location {
                font-size: 10px;
            }

            .info-date {
                font-size: 9px;
            }

            .lightbox-close {
                top: 10px;
                right: 15px;
                font-size: 28px;
            }

            .lightbox-info {
                padding: 12px 4px;
            }

            .lightbox-caption {
                font-size: 13px;
            }

            .lightbox-location {
                font-size: 11px;
            }

            .lightbox-date {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Photos</h1>
            <p class="subtitle">3 images</p>
        </header>

        <div class="photo-grid">
            <div class="photo-item" onclick="openLightbox('assets/401167681_1089362112058541_3531606219538633691_n.jpg', '', 'seattle, wa', '2025.12.08')">
                <img src="assets/401167681_1089362112058541_3531606219538633691_n.jpg" alt="401167681_1089362112058541_3531606219538633691_n.jpg">
                <div class="photo-overlay">
                    <div class="photo-info">
                        <span class="info-location">seattle, wa</span>
                        <span class="info-date">2025.12.08</span>
                    </div>
                </div>
            </div>

            <div class="photo-item" onclick="openLightbox('assets/403825560_656727509676460_1258195955218335996_n.jpg', '', 'seattle, wa', '2025.12.08')">
                <img src="assets/403825560_656727509676460_1258195955218335996_n.jpg" alt="403825560_656727509676460_1258195955218335996_n.jpg">
                <div class="photo-overlay">
                    <div class="photo-info">
                        <span class="info-location">seattle, wa</span>
                        <span class="info-date">2025.12.08</span>
                    </div>
                </div>
            </div>

            <div class="photo-item" onclick="openLightbox('assets/443699161_1146318726396004_8122985863941152306_n.jpg', '', 'seattle, wa', '2025.12.08')">
                <img src="assets/443699161_1146318726396004_8122985863941152306_n.jpg" alt="443699161_1146318726396004_8122985863941152306_n.jpg">
                <div class="photo-overlay">
                    <div class="photo-info">
                        <span class="info-location">Seattle, WA</span>
                        <span class="info-date">2025.12.08</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">&times;</span>
        <button class="lightbox-nav lightbox-nav-prev" id="lightbox-prev" onclick="navigateLightbox(event, -1)">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="lightbox-nav lightbox-nav-next" id="lightbox-next" onclick="navigateLightbox(event, 1)">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
        </button>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img class="lightbox-image" id="lightbox-image" src="" alt="">
            <div class="lightbox-info" id="lightbox-info"></div>
        </div>
    </div>

    <script>
        // Photo data array for navigation
        const photos = [
            { src: 'assets/401167681_1089362112058541_3531606219538633691_n.jpg', caption: '', location: 'seattle, wa', date: '2025.12.08' },
            { src: 'assets/403825560_656727509676460_1258195955218335996_n.jpg', caption: '', location: 'seattle, wa', date: '2025.12.08' },
            { src: 'assets/443699161_1146318726396004_8122985863941152306_n.jpg', caption: '', location: 'Seattle, WA', date: '2025.12.08' }
        ];

        let currentIndex = 0;

        function openLightbox(src, caption, location, date) {
            // Find the index of the clicked photo
            currentIndex = photos.findIndex(p => p.src === src);
            if (currentIndex === -1) currentIndex = 0;

            showPhoto(currentIndex);

            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function showPhoto(index) {
            const photo = photos[index];
            const lightboxImage = document.getElementById('lightbox-image');
            const lightboxInfo = document.getElementById('lightbox-info');
            const prevBtn = document.getElementById('lightbox-prev');
            const nextBtn = document.getElementById('lightbox-next');

            lightboxImage.src = photo.src;

            // Build info HTML
            let infoHtml = '';
            if (photo.caption) {
                infoHtml += '<span class="lightbox-caption">' + photo.caption + '</span>';
            }
            if (photo.location) {
                infoHtml += '<span class="lightbox-location">' + photo.location + '</span>';
            }
            if (photo.date) {
                infoHtml += '<span class="lightbox-date">' + photo.date + '</span>';
            }
            lightboxInfo.innerHTML = infoHtml;

            // Update navigation button states
            if (index === 0) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            if (index === photos.length - 1) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        function navigateLightbox(event, direction) {
            event.stopPropagation();

            const newIndex = currentIndex + direction;

            // Don't navigate if at bounds
            if (newIndex < 0 || newIndex >= photos.length) {
                return;
            }

            currentIndex = newIndex;
            showPhoto(currentIndex);
        }

        function closeLightbox(event) {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;

            if (event.key === 'Escape') {
                closeLightbox(event);
            } else if (event.key === 'ArrowLeft') {
                navigateLightbox(event, -1);
            } else if (event.key === 'ArrowRight') {
                navigateLightbox(event, 1);
            }
        });
    </script>
</body>
</html>
